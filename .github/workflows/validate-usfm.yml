name: Validate and Generate Markdown

on:
  pull_request:
    paths:
      - '**.usfm'
  push:
    branches: [main]
    paths:
      - '**.usfm'
  workflow_dispatch:

jobs:
  validate-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate USFM files
        run: |
          chmod +x scripts/validate.sh
          ./scripts/validate.sh texts/
      
      - name: Generate Markdown versions
        run: python3 scripts/usfm2md.py --all
      
      - name: Commit generated Markdown
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'texts/**/*.md'
          if git diff --staged --quiet; then
            echo "No Markdown changes to commit"
          else
            git commit -m "Auto-generate Markdown from USFM sources"
            git push
          fi
